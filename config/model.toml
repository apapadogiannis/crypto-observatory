# Constants and hand-entered anchors of the required-return (MCM) equation.
# Every value here is taken from "Bitcoin's Required Return" (Papadogiannis 2026); the section is named beside it.
# Anchors are the only inputs that are not read from a data feed. Edit them here, never in the code.

[constants]
equity_risk_premium = 0.04        # a convention (Section 4)
risk_aversion_low   = 1.0         # log utility (Table 3)
risk_aversion_high  = 2.8         # upper household estimate (Table 3)
market_scale_low    = 0.85        # market term cut by 15% at the lower edge (Section 5)
market_scale_high   = 1.15        # and raised by 15% at the upper edge
mortality_low       = 0.003       # sudden collapses only: 0.30% a year at a 95% loss (Section 3)
mortality_high      = 0.035       # every death of a top-twenty asset as a total loss (Section 3): 35 deaths in 1,011.0
                                  # asset-years, 3.46% a year (version 2.0 of the paper), rounded to one decimal.
fund_investor_weight = 0.015      # Bitcoin's share of the wealth of fund and treasury investors (Appendix B)
owner_weight         = 0.19       # crypto share of surveyed owners' financial assets, held at every date: the mean of the
                                  # Cleveland Fed survey of 2021Q3, reported as similar in 2025 (Section 4, Appendix B)
weight_cap           = 0.9
few_hands_ownership  = 0.012      # ownership at or below this: the early holder is all-in (2018 survey)
volatility_halflife_months = 9
beta_window_months   = 48
beta_min_months      = 12          # every estimate uses returns up to its own month only (version 2.0 of the paper)
beta_cap             = 3.0
asset_min_months     = 36          # another asset is priced once it has this many months of returns (Section 6)
genesis              = "2009-01-03"
# The newest hand-entered anchor of each kind may be this old, in months, before the page says so.
ownership_survey_max_age_months = 24
fund_holdings_max_age_months    = 6

[other_assets]   # priced with the same equation (Section 6): weight = kappa x the owner's weight in crypto.
                 # Each needs data/coinmetrics/<code>.csv with PriceUSD and MarketCapUSD. Together with Bitcoin
                 # they make up the crypto market against which kappa is measured.
eth = "Ether"
bnb = "BNB"
sol = "Solana"
trx = "Tron"

[gold]   # gold priced with the same equation, as a check (paper, Appendix E.1). Shown beside the cryptoassets.
beta_low       = -0.1       # its beta to equities is close to zero over long samples
beta_high      = 0.1
weight_low     = 0.02       # the typical holder has a few percent of wealth in gold
weight_high    = 0.10
mortality_low  = 0.0        # no failure mode destroys the asset; the upper figure allows for sovereign restrictions
mortality_high = 0.003
price_asset    = "paxg"     # months after the stored gold ETF series use the month-end price of this gold token (Coin Metrics)

[ownership]   # share of US adults who own crypto (Fed SHED/SCPC, Pew; Weber et al. 2026). Log-linear in between.
              # It sets the early holder's weight only: 1 while ownership is at or below few_hands_ownership, then falling.
"2014-06-30" = 0.004
"2018-06-30" = 0.012
"2021-09-30" = 0.11
"2023-06-30" = 0.12
"2025-06-30" = 0.12

[fund_and_treasury_btc]   # million BTC held through funds and by public companies (Appendix B). Linear in between.
"2013-09-30" = 0.0
"2013-12-31" = 0.069735
"2014-12-31" = 0.134777
"2015-12-31" = 0.141101
"2016-12-31" = 0.172095
"2017-12-31" = 0.175839
"2018-12-31" = 0.204277
"2019-12-31" = 0.281192
"2020-12-31" = 0.703039
"2021-12-31" = 0.860810
"2022-12-31" = 0.856542
"2023-12-31" = 0.900676
"2024-06-30" = 1.15
"2025-06-30" = 2.1
"2026-06-30" = 2.5
"2026-11-20" = 2.51        # Bitcoin Treasuries, 20 Nov 2026: public companies 1,238,887 BTC; nine largest US Bitcoin ETFs 1,268,740 BTC
