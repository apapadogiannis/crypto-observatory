name: update

on:
  schedule:
    - cron: "23 6 3 * *"   # third of each month, after the month-end data are in
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download the latest data into data/
        run: python3 update.py

      - name: Reproduce the paper's stored results on the frozen snapshot
        run: python3 -I tests/test_continuity.py

      - name: Build the page and the data file
        run: |
          python3 -I build.py
          test -s _site/index.html

      - name: The files for programs and AI agents agree with the data file
        run: python3 -I tests/test_agent_files.py

      - name: Store the new data in the repository
        run: |
          if git diff --quiet -- data api; then echo "No new data."; exit 0; fi
          git config user.name "Agisilaos Papadogiannis"
          git config user.email "apapadogiannis@gmail.com"
          git add data api
          git commit -m "Data to $(python3 -I -c "import json; print(json.load(open('_site/data.json'))['meta']['data_to'])")"
          git push

      - name: Hand the built page to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  publish:
    needs: update
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the page
        id: deployment
        uses: actions/deploy-pages@v5
