name: update

on:
  schedule:
    - cron: "23 6 3 * *"   # third of each month, after the month-end data are in
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # this job stores the new data; no other job can write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # the token is not left in .git/config

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download the latest data into data/
        run: python3 update.py

      - name: Reproduce the paper's stored results on the frozen snapshot
        run: python3 -I tests/test_continuity.py

      - name: Build the page and the data file
        run: |
          python3 -I build.py
          test -s _site/index.html

      - name: The files for programs and AI agents agree with the data file
        run: python3 -I tests/test_agent_files.py

      - name: Store the new data in the repository
        env:
          GH_TOKEN: ${{ github.token }}   # for the push below, and for no other step
        run: |
          if git diff --quiet -- data api; then echo "No new data."; exit 0; fi
          git config user.name "Agisilaos Papadogiannis"
          git config user.email "apapadogiannis@gmail.com"
          git add data api
          git commit -m "Data to $(python3 -I -c "import json; print(json.load(open('_site/data.json'))['meta']['data_to'])")"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"

      - name: Hand the built page to GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: _site/

  publish:
    needs: update
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the page
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
