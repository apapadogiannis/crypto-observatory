name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # the token is not left in .git/config

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reproduce the paper's stored results on the frozen snapshot
        run: python3 -I tests/test_continuity.py

      - name: Build the page and the data file
        run: |
          python3 -I build.py
          test -s _site/index.html
          python3 -I -c "import json; d=json.load(open('_site/data.json')); assert d['months'] and d['periods'] and d['latest']['required']['midpoint'] > 0; print('data to', d['meta']['data_to'])"

      - name: The files for programs and AI agents agree with the data file
        run: python3 -I tests/test_agent_files.py

      - name: The files stored under api/ are the ones this build produces
        run: git diff --exit-code -- api

      - name: Hand the built page to GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: _site/

  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the page
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
